<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6f2">
<title>Sign in — FORMA</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<div class="announcement">COMPLIMENTARY SHIPPING ON ORDERS OVER $150</div>
<div class="wrap auth-header"><header><a href="index.html" class="brand">FORMA<small>OBJECTS FOR LIVING</small></a><a class="auth-back" href="index.html">← Back to the shop</a></header></div>
<main class="auth-main">
<div class="eyebrow">Welcome to Forma</div><h1 id="auth-heading">Come on in.</h1>
<p class="intro" id="auth-intro">Sign in to save your favourites and keep track of your orders.</p>
<button class="auth-google" type="button" onclick="mockMessage('Google sign-in is a preview for now.')"><strong>G</strong>&nbsp;&nbsp; Continue with Google</button>
<div class="auth-divider">OR WITH EMAIL</div>
<form id="auth-form"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required><div id="password-wrap"><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" required minlength="8"></div><button class="primary" id="submit-label" type="submit">SIGN IN</button></form>
<div class="auth-status" id="auth-status" aria-live="polite"></div>
<div class="auth-switch" id="auth-switch">New to Forma? <button class="textbutton" type="button" onclick="toggleSignup(true)">Create an account</button></div>
</main>
<footer class="wrap auth-footer"><span>© 2025 FORMAmn STUDIO</span><span>Made for the everyday.</span><a href="index.html">Continue shopping ↗</a></footer>
<script src="auth.js" defer></script>
</body>
</html>
